[package]
name = "cdwifi"
version = "0.1.4"
edition = "2024"
authors = ["MaximMaximS"]
license = "0BSD"
description = "Simple login tool for public wifi in ČD trains"
readme = "README.md"
repository = "https://github.com/MaximMaximS/cdwifi"
categories = ["command-line-utilities"]
keywords = ["wifi", "capnet"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.105"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
scraper = "0.29.0"
